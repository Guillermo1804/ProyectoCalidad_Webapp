<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened="false">
    <p>Contenido del menú lateral</p>
    <button mat-button (click)="clearCache()">Limpiar caché</button>
    <button mat-button (click)="sidenav.close()">Cerrar</button>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="Menu">
      <mat-icon class="slide-bar" (click)="sidenav.toggle()">horizontal_split</mat-icon>
      <div class="button-container">
        <span class="student-count" *ngIf="totalStudents">Total: {{totalStudents}}</span>
        <mat-form-field appearance="outline" class="search-field">
          <input matInput (keyup)="applyFilter($event)" placeholder="Buscar estudiante..." #input>
          <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>
      </div>
      <mat-icon class="home-icon" (click)="goBack()">home</mat-icon>
    </div>

    <div class="main-content">
      <!-- Tabla de datos sin virtualización para mejor compatibilidad con paginación dinámica -->
      <div class="mat-table-container">
        <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
          <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ column }}</th>
            <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- Fila para cuando no hay datos -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" colspan="5">No se encontraron datos que coincidan con el filtro "{{input.value}}"</td>
          </tr>
        </table>

        <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]"
                     [pageSize]="10"
                     aria-label="Seleccionar página de estudiantes"
                     showFirstLastButtons>
        </mat-paginator>
      </div>

      <div *ngIf="isLoading" class="loading">
        <mat-progress-spinner mode="indeterminate" diameter="50"></mat-progress-spinner>
        <p>Cargando datos...</p>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
