<mat-toolbar color="primary">
    <button mat-icon-button (click)="toggleSidenav()">
      <mat-icon>menu</mat-icon>
    </button>
    <button mat-icon-button (click)="goBack()">
      <mat-icon>exit_to_app</mat-icon>
    </button>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened="false">
    <p>Contenido del menú lateral</p>
    <button mat-button (click)="sidenav.close()">Cerrar</button>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="Menu">
      <mat-icon class="slide-bar" (click)="sidenav.toggle()">horizontal_split</mat-icon>
      <div class="button-container">
        <button mat-button>Basic</button>
        <button mat-button>Basic</button>
        <button mat-button>Basic</button>
        <button mat-button>Basic</button>
        <button mat-button>Basic</button>
      </div>
      <mat-icon class="home-icon" (click)="goBack()">home</mat-icon>
    </div>

    <div class="main-content">
      <h2>Lista de Estudiantes</h2>
      
      <!-- Tabla de datos -->
      <div class="mat-table-container">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" *ngIf="dataSource.length > 0">
          <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
            <th mat-header-cell *matHeaderCellDef>{{ column }}</th>
            <td mat-cell *matCellDef="let element">{{ element[column] }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

      <div *ngIf="isLoading" class="loading">
        <mat-progress-spinner mode="indeterminate" diameter="50"></mat-progress-spinner>
        <p>Cargando datos...</p>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
