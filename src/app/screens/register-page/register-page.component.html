<div class="register-container">
  <div class="register-card">
    <h2>Crear cuenta</h2>
    <form (ngSubmit)="register()" #registerForm="ngForm">
      <div class="input-group">
        <input type="text" [(ngModel)]="userData.nombre" class="form-control" id="nombre" placeholder="Nombre(s)" name="nombre" required>
      </div>
      <div class="input-group">
        <input type="text" [(ngModel)]="userData.apellidoPaterno" class="form-control" id="apellidoPaterno" placeholder="Apellido Paterno" name="apellidoPaterno" required>
      </div>
      <div class="input-group">
        <input type="text" [(ngModel)]="userData.apellidoMaterno" class="form-control" id="apellidoMaterno" placeholder="Apellido Materno" name="apellidoMaterno" required>
      </div>
      <div class="input-group">
        <input type="email" [(ngModel)]="userData.email" class="form-control" id="email" placeholder="Correo electrónico" name="email" required email>
      </div>
      <div class="input-group">
        <input type="password" [(ngModel)]="userData.password" class="form-control" id="password" placeholder="Contraseña" name="password" required minlength="8">
      </div>
      <div class="input-group">
        <input type="password" [(ngModel)]="userData.confirmPassword" class="form-control" id="confirmPassword" placeholder="Repetir Contraseña" name="confirmPassword" required>
      </div>
      <div *ngIf="registerForm.submitted && userData.password !== userData.confirmPassword" class="error-message">
        Las contraseñas no coinciden.
      </div>
      <button type="submit" [disabled]="userData.password !== userData.confirmPassword">Registrarse</button>
      <p class="login-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </form>
  </div>
</div>
