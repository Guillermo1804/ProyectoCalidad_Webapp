<div class="register-container">
  <div class="register-card">
    <h2>Registro</h2>
    <form (ngSubmit)="register()" #registerForm="ngForm">
      <!-- Usuario -->
      <div class="input-group" [class.error]="isSubmitted && !user.username">
        <input type="text" id="username" name="username" required [(ngModel)]="user.username">
        <label for="username">Usuario</label>
      </div>

      <!-- Matrícula -->
      <div class="input-group" [class.error]="isSubmitted && !user.matricula">
        <input type="text" id="matricula" name="matricula" required [(ngModel)]="user.matricula">
        <label for="matricula">Matrícula</label>
      </div>

      <!-- Contraseña -->
      <div class="input-group" [class.error]="isSubmitted && !user.password">
        <input type="password" id="password" name="password" required [(ngModel)]="user.password">
        <label for="password">Contraseña</label>
      </div>

      <!-- Confirmar Contraseña -->
      <div class="input-group" [class.error]="isSubmitted && !user.confirmPassword">
        <input type="password" id="confirmPassword" name="confirmPassword" required [(ngModel)]="user.confirmPassword">
        <label for="confirmPassword">Confirmar Contraseña</label>
      </div>
      @if(isSubmitted && !passwordsMatch) {
        <!-- Mensaje de error si las contraseñas no coinciden -->
        <p class="error-message" >⚠ Las contraseñas no coinciden</p>
      }
      <button type="submit">Registrarse</button>
    </form>
  </div>
</div>
